name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || version="0.0.0-dev"
          dotnet publish OpenPdfStudio.csproj -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:Version="$version" \
            -o publish/${{ matrix.rid }}

      - name: Zip
        run: |
          cd publish/${{ matrix.rid }}
          zip -r "$GITHUB_WORKSPACE/OpenPdfStudio-${{ matrix.rid }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: OpenPdfStudio-${{ matrix.rid }}
          path: OpenPdfStudio-${{ matrix.rid }}.zip

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: OpenPdfStudio ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.zip
